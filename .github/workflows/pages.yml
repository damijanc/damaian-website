name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Sent by the client repo's release workflow after it publishes a release.
  repository_dispatch:
    types: [client-release]
  # Safety net in case a dispatch is missed: pick up the latest release daily.
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish; skip queued ones in between.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # reads .ruby-version, runs bundle install, caches gems

      - id: pages
        uses: actions/configure-pages@v5

      - name: Fetch latest client release
        run: bin/fetch-release
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
